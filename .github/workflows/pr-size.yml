name: PR Size

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write

jobs:
  label:
    name: Apply size label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sizes = [
              { name: "size:XS", max: 9 },
              { name: "size:S", max: 29 },
              { name: "size:M", max: 99 },
              { name: "size:L", max: 499 },
              { name: "size:XL", max: 999 },
              { name: "size:XXL", max: Infinity },
            ];
            // Generated or vendored files do not count toward the size.
            const ignored = /(^|\/)(package-lock\.json|bun\.lock|pnpm-lock\.yaml)$|^components\/ui\/|^data\/.*\.json$|^lib\/icon-bundle/;
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const lines = files
              .filter((f) => !ignored.test(f.filename))
              .reduce((n, f) => n + f.additions + f.deletions, 0);
            const wanted = sizes.find((s) => lines <= s.max).name;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const current = pr.labels.map((l) => l.name).filter((n) => n.startsWith("size:"));
            for (const name of current) {
              if (name !== wanted) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name }).catch(() => {});
              }
            }
            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [wanted] });
            }
            core.info(`${lines} effective changed lines -> ${wanted}`);
